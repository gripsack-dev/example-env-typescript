name: ci

# Check both entrypoints against published @gripsack/core 0.45.0 in package-lock.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.23.2
      - run: npm ci && npx tsc
